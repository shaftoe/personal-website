pre-commit:
  parallel: false
  commands:
    standard-documents:
      only:
        - ref: master
      run: pnpm run standard:documents --check
    format:
      run: pnpm run format:fix
      stage_fixed: true
    lint:
      run: pnpm run validate
    build:
      run: pnpm run clean && pnpm run build
    test:
      run: pnpm run test
